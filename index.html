<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Shivam — Portfolio</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #ecebe8; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    canvas { display: block; }
    #loader { position: fixed; left: 50%; bottom: 12vh; transform: translateX(-50%); width: 220px; text-align: center; color: #555; letter-spacing: .18em; font-size: 11px; text-transform: uppercase; transition: opacity .6s; pointer-events: none; }
    #loader .bar { margin-top: 10px; height: 1px; background: #0002; }
    #loader .fill { height: 100%; width: 0; background: #222; }
    #sound { position: fixed; right: 108px; top: 20px; background: none; border: 1px solid #0003; color: #333; padding: 6px 12px; font: inherit; font-size: 11px; letter-spacing: .12em; text-transform: uppercase; cursor: pointer; }
    #replay { position: fixed; right: 20px; top: 20px; background: none; border: 1px solid #0003; color: #333; padding: 6px 12px; font: inherit; font-size: 11px; letter-spacing: .12em; text-transform: uppercase; cursor: pointer; }
    #scrub { position: fixed; left: 20px; right: 140px; bottom: 24px; display: none; }

    /* ---- Case-study deck overlay ---- */
    /* opens by growing out of the clicked billboard (clip-path from its screen rect), content fades in after */
    .deck { position: fixed; inset: 0; z-index: 10; background: #f4f2ee; color: #1a1a1a; overflow: hidden; transition: clip-path .7s cubic-bezier(.7,0,.2,1) .08s, opacity .4s; }
    .deck.fade { opacity: 0; }
    .deck > * { opacity: 0; transition: opacity .22s; }
    .deck.open > * { opacity: 1; transition: opacity .45s .55s; }
    .deck header { position: absolute; top: 0; left: 0; right: 0; z-index: 2; display: flex; align-items: center; gap: 20px; padding: 20px 28px; font-size: 13px; }
    .deck-title { font-weight: 600; }
    .deck-count { color: #7a7670; font-variant-numeric: tabular-nums; margin-left: auto; }
    .deck-close { background: none; border: 1px solid #1a1a1a33; color: inherit; border-radius: 6px; padding: 8px 14px; font: inherit; cursor: pointer; }
    .deck-track { position: absolute; inset: 0; }
    .slide { position: absolute; inset: 0; display: grid; align-content: center; gap: 48px; padding: 96px max(6vw, 24px) 80px; transition: transform .7s cubic-bezier(.65,0,.25,1); }
    .slide.has-media { grid-template-columns: minmax(0, 1fr) minmax(0, 1.25fr); align-items: center; }
    .slide .copy { max-width: 62ch; }
    .slide h2 { font-size: clamp(32px, 4.6vw, 64px); line-height: 1.04; letter-spacing: -.02em; margin: 0 0 20px; }
    .slide h3 { font-size: clamp(18px, 1.8vw, 24px); font-weight: 500; color: #5c5a55; margin: 0 0 16px; }
    .slide p, .slide li { font-size: clamp(16px, 1.3vw, 19px); line-height: 1.6; color: #3a3935; margin: 0 0 14px; }
    .slide ul { padding-left: 20px; margin: 0 0 14px; }
    .slide .media { width: 100%; max-height: 72vh; object-fit: contain; border-radius: 10px; background: #e8e5df; }
    /* content animates in when its slide arrives */
    .slide .copy > *, .slide .media { opacity: 0; transform: translateY(18px); transition: opacity .6s, transform .6s cubic-bezier(.2,.8,.2,1); }
    .slide.on .copy > *, .slide.on .media { opacity: 1; transform: none; }
    .slide.on .copy > :nth-child(1) { transition-delay: .25s; } .slide.on .copy > :nth-child(2) { transition-delay: .35s; }
    .slide.on .copy > :nth-child(3) { transition-delay: .45s; } .slide.on .copy > :nth-child(n+4) { transition-delay: .55s; }
    .slide.on .media { transition-delay: .4s; }
    .deck-nav { position: absolute; bottom: 24px; z-index: 2; width: 44px; height: 44px; border-radius: 50%; border: 1px solid #1a1a1a33; background: none; color: inherit; font-size: 18px; cursor: pointer; }
    .deck-prev { right: 84px; } .deck-next { right: 28px; }
    .deck-close:hover, .deck-nav:hover { background: #1a1a1a0d; }
    .deck-progress { position: absolute; left: 0; right: 0; bottom: 0; height: 3px; background: #1a1a1a14; }
    .deck-progress i { display: block; height: 100%; width: 0; background: #e1312b; transition: width .5s; }
    @media (max-width: 760px) { .slide.has-media { grid-template-columns: 1fr; gap: 24px; } }
    @media (prefers-reduced-motion: reduce) { .deck, .deck > *, .slide, .slide .copy > *, .slide .media { transition: none; } }
    .deck-link { display: inline-block; margin-top: 10px; padding: 11px 18px; border-radius: 999px; background: #1a1a1a; color: #f4f2ee; text-decoration: none; font-size: 15px; }
    .deck-link:hover { background: #e1312b; }

    /* ---- Dock: faded street map with section places + a travelling location pin; contact stamps at the end ---- */
    #dock { position: fixed; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); z-index: 5; width: min(780px, calc(100vw - 24px)); height: 92px; display: flex; align-items: center;
      border-radius: 34px; background: #fbfaf7; box-shadow: 0 10px 40px #1a1a1a24, 0 0 0 1px #1a1a1a0f; overflow: visible;
      opacity: 0; transform: translate(-50%, 20px); pointer-events: none; transition: opacity .5s, transform .6s cubic-bezier(.2,.8,.2,1); }
    #dock.on { opacity: 1; transform: translate(-50%, 0); pointer-events: auto; }
    .dock-map { position: relative; flex: 1; height: 100%; border-radius: 34px 0 0 34px; }
    .streets { position: absolute; inset: 0; width: 100%; height: 100%; border-radius: 34px 0 0 34px;
      -webkit-mask: radial-gradient(120% 140% at 45% 50%, #000 55%, transparent 100%); mask: radial-gradient(120% 140% at 45% 50%, #000 55%, transparent 100%); opacity: .9; }
    .place { position: absolute; top: 58%; transform: translate(-50%, -50%); display: grid; justify-items: center; gap: 4px; background: none; border: 0; padding: 6px; cursor: pointer; font: inherit; }
    .place i { width: 11px; height: 11px; border-radius: 50%; background: #fff; border: 2.5px solid #3c8ef0; box-shadow: 0 1px 3px #0003; }
    .place span { font-size: 11px; font-weight: 600; color: #6d6a64; white-space: nowrap; text-shadow: 0 0 4px #fff, 0 0 4px #fff; }
    .place:hover i { transform: scale(1.25); } .place[aria-pressed="true"] { visibility: hidden; }
    .place:focus-visible { outline: 2px solid #3c8ef0; border-radius: 8px; }
    .pin { position: absolute; top: -18px; transform: translateX(-50%); display: grid; justify-items: center; pointer-events: none; transition: left .7s cubic-bezier(.5,1.3,.4,1); }
    .pin-head { position: relative; width: 54px; height: 54px; border-radius: 50%; background: #fff; box-shadow: 0 6px 16px #1a1a1a30; display: grid; place-items: center; }
    .pin-head::after { content: ""; position: absolute; left: 50%; bottom: -7px; width: 14px; height: 14px; background: #fff; transform: translateX(-50%) rotate(45deg); border-radius: 0 0 4px 0; box-shadow: 4px 4px 6px #1a1a1a14; } /* the pin's point */
    .pin-head::before { content: ""; position: absolute; inset: 5px; border-radius: 50%; background: linear-gradient(#6db3ff, #2f7fe8); z-index: 1; }
    .pin-head svg { position: relative; z-index: 2; width: 22px; height: 22px; color: #fff; }
    .pin-label { margin-top: 8px; font-size: 16px; font-weight: 700; color: #5d5a55; letter-spacing: -.01em; white-space: nowrap; text-shadow: 0 0 6px #fff, 0 0 6px #fff; }
    .pin.drop .pin-head { animation: pin-drop .55s cubic-bezier(.3,1.5,.5,1); }
    @keyframes pin-drop { 0% { transform: translateY(-14px) scale(.9); } 100% { transform: none; } }
    .stamps { display: flex; gap: 8px; align-items: center; padding: 0 20px 0 12px; height: 100%; border-left: 1px dashed #1a1a1a1f; }
    /* postage stamp: perforated edge = paper-coloured dots punched round a coloured face */
    .stamp { display: block; padding: 5px; text-decoration: none; transform: rotate(var(--r)); transition: transform .25s cubic-bezier(.2,.8,.2,1);
      background: radial-gradient(circle, transparent 2.6px, #fbf8f1 2.9px) -4px -4px / 8px 8px; filter: drop-shadow(0 3px 5px #1a1a1a2e); }
    .stamp:hover, .stamp:focus-visible { transform: rotate(0deg) translateY(-6px) scale(1.06); outline: none; }
    .stamp-face { display: grid; place-items: center; width: 44px; height: 54px; background: var(--c); color: #fbf8f1; outline: 1.5px solid #fbf8f1aa; outline-offset: -5px; }
    .stamp-face b { font: 700 18px/1 system-ui, sans-serif; margin-top: 5px; }
    .stamp-face small { font-size: 6.5px; letter-spacing: .06em; text-transform: uppercase; margin-bottom: 6px; }

    /* ---- Lightbox: work enlarges out of its billboard ---- */
    .lightbox { position: fixed; inset: 0; z-index: 10; display: grid; place-items: center; align-content: center; gap: 16px; padding: 24px; background: rgba(244,242,238,0); backdrop-filter: blur(0); transition: background .45s, backdrop-filter .45s; cursor: zoom-out; }
    .lightbox.open { background: rgba(244,242,238,.82); backdrop-filter: blur(6px); }
    .lb-media { display: block; max-width: min(1200px, 88vw); max-height: 76vh; border-radius: 8px; box-shadow: 0 20px 60px #1a1a1a33; background: #1a1a1a; transition: transform .55s cubic-bezier(.7,0,.2,1); transform-origin: 50% 50%; }
    .lb-frame { position: relative; width: min(1200px, 88vw); aspect-ratio: 16 / 10; background: #e8e5df center / cover no-repeat; overflow: hidden; cursor: auto; }
    .lb-frame iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
    .lb-cap { display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 8px 12px; max-width: min(1000px, 88vw); color: #3a3935; font-size: 14px; text-align: center; opacity: 0; transition: opacity .3s; }
    .lightbox.open .lb-cap { opacity: 1; transition-delay: .35s; }
    .lb-cap b { color: #1a1a1a; font-size: 16px; }
    .lb-tag { font-size: 12px; padding: 3px 9px; border-radius: 999px; border: 1px solid #1a1a1a22; }
    .lb-open { padding: 7px 14px; border-radius: 999px; background: #1a1a1a; color: #f4f2ee; text-decoration: none; font-size: 13px; cursor: pointer; }
    .lb-open:hover { background: #e1312b; }
    .lb-close { position: fixed; top: 18px; right: 18px; width: 40px; height: 40px; border-radius: 50%; border: 1px solid #1a1a1a33; background: #fbf8f1; font-size: 22px; line-height: 1; cursor: pointer; }
    @media (max-width: 720px) { #dock { height: 84px; border-radius: 28px; } .dock-map, .streets { border-radius: 28px 0 0 28px; } .stamp-face { width: 38px; height: 46px; } .stamp-face b { font-size: 17px; } .stamp-face small { display: none; } .stamps { gap: 5px; padding: 0 14px 0 10px; } .place span { display: none; } .pin-head { width: 46px; height: 46px; } .pin-head svg { width: 20px; height: 20px; } .pin-label { display: none; } }
    @media (prefers-reduced-motion: reduce) { .lb-media, .lightbox, .stamp, .pin { transition: none; animation: none; } }
  </style>
</head>
<body>
  <nav id="dock" aria-label="Sections and contact"></nav>
  <div id="loader"><span id="pct">Loading</span><div class="bar"><div class="fill" id="fill"></div></div></div>
  <button id="sound" type="button">Sound on</button>
  <button id="replay" title="Replay (R)">Replay</button>
  <input id="scrub" type="range" min="0" max="1" step="0.001" value="0" />
  <script type="module" src="/src/main.js"></script>
</body>
</html>
