<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Shivam — Portfolio</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #ecebe8; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    canvas { display: block; }
    #loader { position: fixed; left: 50%; bottom: 12vh; transform: translateX(-50%); width: 220px; text-align: center; color: #555; letter-spacing: .18em; font-size: 11px; text-transform: uppercase; transition: opacity .6s; pointer-events: none; }
    #loader .bar { margin-top: 10px; height: 1px; background: #0002; }
    #loader .fill { height: 100%; width: 0; background: #222; }
    #replay { position: fixed; right: 20px; bottom: 20px; background: none; border: 1px solid #0003; color: #333; padding: 6px 12px; font: inherit; font-size: 11px; letter-spacing: .12em; text-transform: uppercase; cursor: pointer; }
    #scrub { position: fixed; left: 20px; right: 140px; bottom: 24px; display: none; }
  </style>
</head>
<body>
  <div id="loader"><span id="pct">Loading</span><div class="bar"><div class="fill" id="fill"></div></div></div>
  <button id="replay" title="Replay (R)">Replay</button>
  <input id="scrub" type="range" min="0" max="1" step="0.001" value="0" />
  <script type="module" src="/src/main.js"></script>
</body>
</html>
